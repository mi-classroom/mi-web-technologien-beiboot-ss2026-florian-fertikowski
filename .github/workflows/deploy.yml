name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm install

      # gesture-lib is consumed by reha-vision as a built package
      - run: npm run build --workspace=gesture-lib
      - run: npm run build --workspace=reha-vision

      # GitHub Pages runs deployments through Jekyll by default,
      # which ignores any folder starting with an underscore —
      # including Next.js's own _next/ build output, where every
      # CSS/JS asset lives. An empty .nojekyll file tells Pages to
      # skip Jekyll processing entirely and serve files as-is.
      - run: touch packages/reha-vision/out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/reha-vision/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4